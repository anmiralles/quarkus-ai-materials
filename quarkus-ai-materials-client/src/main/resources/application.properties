# Materials service base URL — override in consuming application
server.url=http://localhost:8080/
quarkus.rest-client.material-client.url=${server.url}
quarkus.rest-client.product-client.url=${server.url}
quarkus.rest-client.bom-client.url=${server.url}

quarkus.http.port=8081

# Package as self-contained uber-jar
quarkus.package.jar.type=uber-jar
quarkus.package.jar.add-runner-suffix=false

# STDIO by default; HTTP disabled unless --sse flag used
quarkus.http.host-enabled=false

# Dev mode: disable STDIO so dev console works interactively
%dev.quarkus.mcp.server.stdio.enabled=false

# Logging
quarkus.log.level=INFO
quarkus.log.category."me.amiralles.materials.client".level=DEBUG
quarkus.mcp.server.traffic-logging.enabled=true
quarkus.mcp.server.traffic-logging.text-limit=5000

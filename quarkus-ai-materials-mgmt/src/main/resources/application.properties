# ──────────────────────────────────────────
# Datasource (shared by Flyway JDBC + Reactive ORM)
# ──────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
#quarkus.datasource.username=${DB_USERNAME:materials}
#quarkus.datasource.password=${DB_PASSWORD:materials}
#quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:materials}
#quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:materials}

# ──────────────────────────────────────────
# Flyway
# ──────────────────────────────────────────
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true

# Dev: reset schema on each restart (NEVER in prod)
%dev.quarkus.flyway.clean-at-start=true
%dev.quarkus.flyway.locations=db/migration,db/testdata

# ──────────────────────────────────────────
# Hibernate — validate schema matches migration (all profiles)
# Disable Hibernate schema generation; Flyway owns the schema
# ──────────────────────────────────────────
quarkus.hibernate-orm.schema-management.strategy=validate
